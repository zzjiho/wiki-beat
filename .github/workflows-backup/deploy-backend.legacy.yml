name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'wiki-back/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create application-prod.yml
        run: |
          mkdir -p ./wiki-back/src/main/resources
          echo "${{ secrets.APPLICATION_PROD_YML }}" > ./wiki-back/src/main/resources/application-prod.yml

      - name: Grant permission for gradlew
        run: chmod +x ./wiki-back/gradlew

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wiki-back
          file: ./wiki-back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wiki-beat-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 10m
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Starting Backend Deployment..."

            docker pull ghcr.io/${{ github.repository_owner }}/wiki-beat-backend:latest

            docker stop wiki-beat-backend 2>/dev/null || true
            docker rm wiki-beat-backend 2>/dev/null || true

            docker run -d \
              --name wiki-beat-backend \
              --network shared-infra \
              -p 8888:8888 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e KAFKA_BOOTSTRAP_SERVERS=shared-kafka:29092 \
              -e REDIS_HOST=shared-redis \
              -e REDIS_PORT=6379 \
              -e REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
              --add-host=host.docker.internal:host-gateway \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/wiki-beat-backend:latest

            echo "Health check..."
            for i in {1..10}; do
              if curl -sf http://localhost:8888/api/health-check > /dev/null 2>&1; then
                echo "Application is healthy!"
                break
              fi
              echo "Waiting... (attempt $i/10)"
              sleep 10
            done

            docker ps --filter name=wiki-beat-backend --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            docker image prune -f

            echo "Backend deployment completed!"
