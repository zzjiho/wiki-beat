name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'wiki-front/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wiki-front
          file: ./wiki-front/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wiki-beat-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 10m
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Starting Frontend Deployment..."

            docker pull ghcr.io/${{ github.repository_owner }}/wiki-beat-frontend:latest

            docker stop wiki-beat-frontend 2>/dev/null || true
            docker rm wiki-beat-frontend 2>/dev/null || true

            docker run -d \
              --name wiki-beat-frontend \
              --network shared-infra \
              -p 3000:80 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/wiki-beat-frontend:latest

            echo "Health check..."
            sleep 5
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Frontend is healthy!"
            else
              echo "Health endpoint not responding (may be normal for SPA)"
            fi

            docker ps --filter name=wiki-beat-frontend --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            docker image prune -f

            echo "Frontend deployment completed!"
