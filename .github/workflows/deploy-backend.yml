name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'wiki-back/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create application-prod.yml
        run: |
          mkdir -p ./wiki-back/src/main/resources
          echo "${{ secrets.APPLICATION_PROD_YML }}" > ./wiki-back/src/main/resources/application-prod.yml

      - name: Grant permission for gradlew
        run: chmod +x ./wiki-back/gradlew

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wiki-back
          file: ./wiki-back/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wiki-beat-back:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server with Zero Downtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 10m
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create scripts directory if not exists
            mkdir -p ~/wiki-beat-scripts

            # Download deployment script from repository (works for private repos)
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o ~/wiki-beat-scripts/deploy-backend-zero-downtime.sh \
              https://raw.githubusercontent.com/${{ github.repository }}/main/docker/scripts/deploy-backend-zero-downtime.sh

            # Make script executable
            chmod +x ~/wiki-beat-scripts/deploy-backend-zero-downtime.sh

            # Run zero-downtime deployment
            export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            ~/wiki-beat-scripts/deploy-backend-zero-downtime.sh
