name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'wiki-front/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wiki-front
          file: ./wiki-front/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wiki-beat-front:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server with Zero Downtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 10m
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create scripts directory if not exists
            mkdir -p ~/wiki-beat-scripts

            # Download deployment script from repository (works for private repos)
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o ~/wiki-beat-scripts/deploy-frontend-zero-downtime.sh \
              https://raw.githubusercontent.com/${{ github.repository }}/main/docker/scripts/deploy-frontend-zero-downtime.sh

            # Make script executable
            chmod +x ~/wiki-beat-scripts/deploy-frontend-zero-downtime.sh

            # Run zero-downtime deployment
            ~/wiki-beat-scripts/deploy-frontend-zero-downtime.sh
