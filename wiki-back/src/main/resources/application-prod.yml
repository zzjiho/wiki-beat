
# git secrets에 들어갈 yml 설정

# Production environment configuration

# Kafka (Shared infrastructure)
kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:shared-kafka:29092}

# Redis (Shared infrastructure)
redis:
  host: ${REDIS_HOST:shared-redis}
  port: 6379
  password: ${REDIS_PASSWORD}

# Logging
logging:
  level:
    wiki: INFO
    wiki.kafka: WARN
    wiki.kafka.consumer.service.RawEditConsumerService: INFO
    wiki.service: INFO
    org.springframework.kafka: WARN
    org.springframework.data.redis: WARN
  charset:
    console: UTF-8

# Processing configuration
bigdata:
  processing:
    batch-size: 1000
    stats-interval: 60s
    language-stats-interval: 60s
    total-stats-interval: 60s
  cache:
    minute-stats-ttl: 3600s
    language-stats-ttl: 86400s
    total-stats-ttl: 43200s

# Wikimedia reconnection settings
wikimedia:
  stream:
    reconnect-delay: 5s
    max-retries: 10